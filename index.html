<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Management Tools ala Shafic</title>
    <!-- Tailwind CSS untuk Desain Modern dan Responsive -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen pb-10">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-6 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold"><i class="fa-solid fa-wallet mr-2"></i> Shafic Finance</h1>
                <p class="text-xs text-indigo-200">Catat keuangan biar gak boncos!</p>
            </div>
            <button onclick="resetData()" class="text-xs bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded-lg transition">
                <i class="fa-solid fa-rotate-right mr-1"></i> Reset
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">
        <!-- Ringkasan Kartu -->
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-xs text-slate-500 font-medium">Total Pemasukan</p>
                <p id="totalIncome" class="text-lg font-bold text-emerald-600 mt-1">Rp 0</p>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-xs text-slate-500 font-medium">Total Pengeluaran</p>
                <p id="totalExpense" class="text-lg font-bold text-rose-600 mt-1">Rp 0</p>
            </div>
        </div>

        <!-- Sisa Saldo / Net -->
        <div class="bg-gradient-to-r from-indigo-500 to-violet-600 text-white p-5 rounded-2xl shadow-md">
            <p class="text-xs text-indigo-100 uppercase tracking-wider font-semibold">Sisa Tabungan / Bersih</p>
            <h2 id="netBalance" class="text-2xl font-extrabold mt-1">Rp 0</h2>
            <p id="statusMessage" class="text-xs mt-2 bg-white/20 px-2 py-1 rounded inline-block">Mulai catat keuanganmu!</p>
        </div>

        <!-- Form Tambah Transaksi -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
            <h3 class="font-bold text-slate-700 mb-4 text-sm flex items-center">
                <i class="fa-solid fa-circle-plus text-indigo-600 mr-2"></i> Tambah Transaksi Baru
            </h3>
            <form id="transactionForm" onsubmit="addTransaction(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Keterangan / Nama Transaksi</label>
                    <input type="text" id="desc" required placeholder="Contoh: Gaji, Kos, Cicilan Mobil" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Nominal (Rp)</label>
                        <input type="number" id="amount" required placeholder="5000000" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Kategori</label>
                        <select id="category" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                            <option value="Pemasukan">Pemasukan</option>
                            <option value="Kebutuhan">Kebutuhan (Kos/Makan/Transport)</option>
                            <option value="Keiningan">Keinginan (Lifestyle)</option>
                            <option value="Cicilan">Cicilan / Paylater</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-sm">
                    Simpan Transaksi
                </button>
            </form>
        </div>

        <!-- Riwayat Transaksi -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
            <h3 class="font-bold text-slate-700 mb-3 text-sm flex items-center justify-between">
                <span><i class="fa-solid fa-list-ul text-indigo-600 mr-2"></i> Riwayat Transaksi</span>
                <span id="transactionCount" class="text-xs bg-slate-100 px-2 py-0.5 rounded-full text-slate-500">0 item</span>
            </h3>
            <div id="transactionList" class="space-y-2.5 max-h-64 overflow-y-auto pr-1">
                <!-- List akan terisi secara otomatis lewat JavaScript -->
                <p class="text-center text-xs text-slate-400 py-4">Belum ada transaksi tercatat.</p>
            </div>
        </div>
    </main>

    <!-- JavaScript Logika -->
    <script>
        let transactions = JSON.parse(localStorage.getItem('shafic_transactions')) || [];

        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number);
        }

        function updateUI() {
            const listEl = document.getElementById('transactionList');
            const totalIncomeEl = document.getElementById('totalIncome');
            const totalExpenseEl = document.getElementById('totalExpense');
            const netBalanceEl = document.getElementById('netBalance');
            const statusMsgEl = document.getElementById('statusMessage');
            const countEl = document.getElementById('transactionCount');

            listEl.innerHTML = '';
            let income = 0;
            let expense = 0;

            if (transactions.length === 0) {
                listEl.innerHTML = '<p class="text-center text-xs text-slate-400 py-4">Belum ada transaksi tercatat.</p>';
            }

            transactions.forEach((trx, index) => {
                if (trx.category === 'Pemasukan') {
                    income += trx.amount;
                } else {
                    expense += trx.amount;
                }

                const item = document.createElement('div');
                item.className = 'flex justify-between items-center p-3 bg-slate-50 rounded-xl border border-slate-100 text-sm';
                
                let badgeColor = 'bg-blue-100 text-blue-700';
                if(trx.category === 'Pemasukan') badgeColor = 'bg-emerald-100 text-emerald-700';
                if(trx.category === 'Kebutuhan') badgeColor = 'bg-amber-100 text-amber-700';
                if(trx.category === 'Keiningan') badgeColor = 'bg-purple-100 text-purple-700';
                if(trx.category === 'Cicilan') badgeColor = 'bg-rose-100 text-rose-700';

                item.innerHTML = `
                    <div class="space-y-0.5">
                        <p class="font-semibold text-slate-700">${trx.desc}</p>
                        <span class="text-[10px] px-2 py-0.5 rounded-full font-medium ${badgeColor}">${trx.category}</span>
                    </div>
                    <div class="flex items-center space-x-3">
                        <span class="font-bold ${trx.category === 'Pemasukan' ? 'text-emerald-600' : 'text-slate-700'}">
                            ${trx.category === 'Pemasukan' ? '+' : '-'} ${formatRupiah(trx.amount)}
                        </span>
                        <button onclick="deleteTransaction(${index})" class="text-slate-400 hover:text-rose-500 transition">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                `;
                listEl.appendChild(item);
            });

            let net = income - expense;
            totalIncomeEl.innerText = formatRupiah(income);
            totalExpenseEl.innerText = formatRupiah(expense);
            netBalanceEl.innerText = formatRupiah(net);
            countEl.innerText = `${transactions.length} item`;

            if (net > 0) {
                statusMsgEl.innerText = "✨ Keuanganmu sehat, pertahankan disiplin menabung!";
            } else if (net < 0) {
                statusMsgEl.innerText = "⚠️ Waspada! Keuanganmu minus (boncos)! Kurangi cicilan & gaya hidup.";
            } else {
                statusMsgEl.innerText = "⚖️ Keuangan pas-pasan, atur ulang prioritasmu.";
            }

            localStorage.setItem('shafic_transactions', JSON.stringify(transactions));
        }

        function addTransaction(e) {
            e.preventDefault();
            const desc = document.getElementById('desc').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const category = document.getElementById('category').value;

            transactions.unshift({ desc, amount, category });
            document.getElementById('transactionForm').reset();
            updateUI();
        }

        function deleteTransaction(index) {
            transactions.splice(index, 1);
            updateUI();
        }

        function resetData() {
            if(confirm("Yakin ingin mereset semua data keuangan?")) {
                transactions = [];
                updateUI();
            }
        }

        // Inisialisasi awal
        updateUI();
    </script>
</body>
</html>
